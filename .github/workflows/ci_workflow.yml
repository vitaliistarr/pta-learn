name: Test, Version Check & Stage Mirror

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  version-check:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract & compare version
        run: |
          pip install packaging requests
          VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          python - <<EOF
          import requests
          from packaging.version import Version
          local = Version("$VERSION")
          data = requests.get("https://pypi.org/pypi/pta-learn/json").json()
          published = Version(data["info"]["version"])
          assert local > published, f"{local} must exceed published {published}"
          EOF

  test:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: pytest

  stage-mirror:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - env:
          PUBLIC_REPO_PAT: ${{ secrets.PUBLIC_REPO_PAT_TEST }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add public https://x-access-token:${PUBLIC_REPO_PAT}@github.com/vitaliistarr/pta-learn-test-repo.git
          git push public main:staging --force