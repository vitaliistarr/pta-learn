name: Verify Staging & Auto-Merge Release PR

on:
  push:
    branches: [staging]

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install packaging requests
          VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          python - <<EOF
          import requests
          from packaging.version import Version
          local = Version("$VERSION")
          data = requests.get("https://pypi.org/pypi/pta-learn/json").json()
          published = Version(data["info"]["version"])
          assert local > published, f"{local} must exceed published {published}"
          EOF

  test:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: pytest

  open-and-merge-pr:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_PAT_TEST }}
        run: |
          gh pr create \
            --base main \
            --head staging \
            --title "Release: promote staging to main" \
            --body "Automated release PR. Version check and tests passed." \
            || echo "PR already exists, skipping creation"

      - name: Auto-merge release PR
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_PAT_TEST }}
        run: |
          PR_NUMBER=$(gh pr list --base main --head staging --json number --jq '.[0].number')
          gh pr merge "$PR_NUMBER" --merge --auto