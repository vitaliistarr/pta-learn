name: Version-check and Test

on:
  pull_request:
    branches: [main]

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install packaging requests
          VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          python - <<EOF
          import requests
          from packaging.version import Version
          local = Version("$VERSION")
          data = requests.get("https://pypi.org/pypi/pta-learn/json").json()
          published = Version(data["info"]["version"])
          assert local > published, f"{local} must exceed published {published}"
          EOF

  test:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: pytest